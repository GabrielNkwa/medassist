kind = "web"
previewPath = "/"
title = "MedAssist"
version = "1.0.0"
id = "artifacts/medassist"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20913

[services.development]
run = "pnpm --filter @workspace/medassist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medassist", "run", "build" ]
publicDir = "artifacts/medassist/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20913"
BASE_PATH = "/"
